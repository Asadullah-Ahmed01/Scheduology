<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - Scheduology</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="js/theme.js"></script>
  <style>
    /* Auth-specific styles for standalone pages */
    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    
    .auth-art {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg-blue-500);
      color: white;
    }
    
    .auth-art .brand {
      color: inherit;
    }
    
    .auth-art .mark {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .auth-art h2 {
      font-size: 1.625rem;
      margin: 0.75rem 0;
      max-width: 12ch;
    }
    
    .auth-form {
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    
    .form-container {
      width: min(420px, 100%);
    }
    
    .form-title {
      margin-bottom: 1rem;
    }
    
    .form-title h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    
    .form-title p {
      margin: 0.5rem 0 0;
      color: var(--text-slate-500);
      font-size: 0.9375rem;
    }
    
    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-slate-200);
    }
    
    .tiny {
      font-size: 0.8125rem;
      color: var(--text-slate-500);
      line-height: 1.45;
    }
    
    .muted {
      color: var(--text-slate-500);
    }
    
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 0.875rem;
    }
    
    .field span {
      font-size: 0.8125rem;
      color: var(--text-slate-500);
      font-weight: 600;
    }
    
    .field input,
    .input {
      background: var(--bg-white);
      border: 1px solid var(--border-slate-200);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      outline: none;
      width: 100%;
      transition: var(--transition);
      color: var(--text-slate-800);
    }
    
    .field input:focus,
    .input:focus {
      border-color: var(--bg-blue-500);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    
    .field input::placeholder {
      color: var(--text-slate-500);
    }
    
    .btn-block {
      width: 100%;
    }
    
    .login-link {
      text-align: center;
      margin-top: 16px;
    }
    
    .login-link a {
      color: var(--bg-blue-500);
    }
    
    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
      }
      
      .auth-art {
        display: none;
      }
      
      .auth-form {
        padding: 2rem;
      }
    }
    
    /* Google button icon */
    .google-icon {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="auth-art">
    <a class="brand" href="index.html" style="color:#f7f1e6">
      <span class="mark" style="background:#f7f1e6;color:#2b5d4c">S</span>
      <strong>Scheduology</strong>
    </a>
    <div>
      <p class="tiny" style="color:#e6dcc8">For the week you cannot miss</p>
      <h2>Eligibility should never be a surprise.</h2>
    </div>
    <p class="tiny" style="color:#e6dcc8">Set your required rate, map the semester, and check in after class.</p>
  </div>
  
  <div class="auth-form">
    <div class="form-container">
      <div class="form-title">
        <h1>Welcome back</h1>
        <p>Sign in to access your attendance data</p>
      </div>
      
      <button class="btn btn-ghost btn-block" onclick="handleGoogleLogin()" style="margin-bottom: 12px;">
        <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
      
      <div class="divider">
        <span class="tiny muted">or</span>
      </div>
      
      <form id="login-form">
        <div class="field">
          <span>Email</span>
          <input type="email" id="login-email" placeholder="your@email.com" required />
        </div>
        <div class="field">
          <span>Password</span>
          <input type="password" id="login-password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In with Email</button>
      </form>
      
      <p class="tiny login-link">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>
    </div>
  </div>
  
  <script>
    // Handle Google login
    function handleGoogleLogin() {
      alert('Google login will be configured with backend integration later.');
    }
    
    // Handle form submission
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }
      
      // For demo purposes, store user and redirect
      const user = {
        id: Date.now().toString(36) + Math.random().toString(36).substr(2),
        email: email,
        name: email.split('@')[0]
      };
      
      localStorage.setItem('scheduology_user', JSON.stringify(user));
      localStorage.removeItem('scheduology_demo');
      
      // Redirect to app (using hash-based navigation for SPA compatibility)
      window.location.href = 'index.html#today';
    });
  </script>
</body>
</html>
